# 本地真实配置请放到 config/ai-presets.yaml（已加入 .gitignore）。
# 下面是最小可运行模板，直接替换成你自己的 endpoint / token / model。
presets:
  - id: gpt-5-4
    name: GPT-5.4
    endpoint: https://llmbox-global.byteintl.net/v1
    token: replace-with-your-token
    model: gpt-5.4
    structured_output: tool_call
    system_prompt: ""

  - id: glm-5-1
    name: GLM-5.1
    endpoint: https://llmbox-global.byteintl.net/v1
    token: replace-with-your-token
    model: glm-5.1
    structured_output: json_object
    system_prompt: ""
    max_tokens: 512
    extra_body:
      reasoning_effort: none
    extra_headers:
      X-Source: ttadk

  - id: deepseek-v4-pro
    name: Deepseek-V4-Pro
    endpoint: https://llmbox-global.byteintl.net/v1
    token: replace-with-your-token
    model: deepseek-v4-pro
    structured_output: tool_call
    system_prompt: ""
    max_tokens: 512
    extra_body:
      thinking:
        type: disabled

# 可选：语音转写。人机局里真人发言时可用麦克风口述，后端会把音频转成文字。
# 参考 /Users/bytedance/self/voice2text 的 mimo provider（OpenAI 兼容 chat/completions + input_audio）。
# 不填 asr 或字段留空即视为关闭，前端不会显示麦克风按钮。
asr:
  endpoint: https://api.xiaomimimo.com/v1
  token: replace-with-your-token
  model: mimo-v2.5-asr
  language: zh

